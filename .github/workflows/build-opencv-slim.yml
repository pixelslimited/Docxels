name: Build slim OpenCV

# Run by hand (Actions, Run workflow) when the OpenCV version changes. Docxels uses only the core, imgproc and photo
# modules, but the published OpenCV Android library ships every module (about 7.8 MB of native code). This builds just
# the three modules we use, checks that every native function the app's OpenCV classes need is still exported, and
# publishes the result as a release asset that the app build picks up.
on:
  workflow_dispatch:

jobs:
  slim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CV: "4.9.0"
    steps:
      - name: Get OpenCV sources
        run: git clone --depth 1 --branch "$CV" https://github.com/opencv/opencv.git

      - name: Configure (arm64-v8a, core + imgproc + photo only)
        run: |
          set -o pipefail
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $NDK"
          cmake -S opencv -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,imgproc,photo,java_bindings_generator,java \
            -DBUILD_ANDROID_EXAMPLES=OFF -DBUILD_KOTLIN_EXTENSIONS=OFF -DANDROID_SDK="$ANDROID_HOME" \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_DOCS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF \
            -DWITH_OPENCL=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_TBB=OFF -DWITH_PROTOBUF=OFF -DCV_TRACE=OFF \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -Wl,--exclude-libs,ALL" 2>&1 | tee cfg.txt

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.txt | tail -40

      - name: Find, strip and compare with the full library
        run: |
          set -eo pipefail
          exec > >(tee diag.txt) 2>&1
          SO=$(find build -name 'libopencv_java4.so' | head -1)
          [ -n "$SO" ] || { echo "libopencv_java4.so was not built"; find build -name '*.so' | head; exit 1; }
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          STRIP=$(find "$NDK/toolchains/llvm/prebuilt" -name llvm-strip | head -1)
          NM=$(find "$NDK/toolchains/llvm/prebuilt" -name llvm-nm | head -1)
          cp "$SO" libopencv_java4.so && "$STRIP" --strip-unneeded libopencv_java4.so
          ls -l libopencv_java4.so
          # The published library, for comparison.
          curl -fsSL -o opencv.aar "https://repo1.maven.org/maven2/org/opencv/opencv/$CV/opencv-$CV.aar"
          unzip -o -q opencv.aar 'jni/arm64-v8a/libopencv_java4.so' -d full
          ls -l full/jni/arm64-v8a/libopencv_java4.so
          # Every native function of the classes Docxels uses (core, imgproc, photo, android Utils) must still be there.
          pat='Java_org_opencv_(core|imgproc|photo|android)_'
          "$NM" -D --defined-only full/jni/arm64-v8a/libopencv_java4.so | awk '{print $3}' | grep -E "$pat" | sort -u > want.txt
          "$NM" -D --defined-only libopencv_java4.so | awk '{print $3}' | grep -E "$pat" | sort -u > have.txt
          wc -l want.txt have.txt
          comm -23 want.txt have.txt > missing.txt
          if [ -s missing.txt ]; then echo "Missing native functions:"; head -50 missing.txt; exit 1; fi

      # Job logs are not readable from the session that maintains this repo, so the result is also posted as a comment.
      - name: Post the result as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "slim OpenCV step output:"; echo '```'
            echo "--- configure summary"; grep -A28 'OpenCV modules' cfg.txt 2>/dev/null | head -40
            echo "--- java section"; grep -B1 -A14 '^--   Java:' cfg.txt 2>/dev/null | head -24
            echo "--- java/android lines"; grep -i -E 'java|android' cfg.txt 2>/dev/null | grep -i -E 'disabled|skip|not|no |unavailable|error|warn' | head -15
            echo "--- built libraries"; find build -name '*.so' 2>/dev/null | head; find build -name '*.a' 2>/dev/null | head -12
            echo "--- step output"; tail -c 2500 diag.txt 2>/dev/null
            echo '```'
          } > diag.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@diag.md || true

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "opencv-slim-$CV" --yes --cleanup-tag 2>/dev/null || true
          gh release create "opencv-slim-$CV" libopencv_java4.so --title "Slim OpenCV $CV (arm64-v8a)" \
            --notes "core, imgproc and photo only; built by .github/workflows/build-opencv-slim.yml" --prerelease --latest=false
