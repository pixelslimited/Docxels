name: Emulator check

# Runs the real app on an Android emulator, walks through it, and posts screenshots to the site repo's "qa-shots"
# release so they can be looked at. Test documents only: no private data is involved.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
    steps:
      # The runner's disk fills up (the emulator image is large), so remove tools this job never uses first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK for the emulator (x86_64)
        run: gradle :app:assembleRelease -Pabis=x86_64 --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/qa/run.sh app/build/outputs/apk/release/app-release.apk qa-out || true
      - name: Post screenshots
        if: always() && env.SITE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          SITE=iCode010101/docxels-site
          gh release delete qa-shots --repo "$SITE" --yes --cleanup-tag || true
          gh release create qa-shots --repo "$SITE" --title "Emulator check" --notes "Run ${{ github.run_number }}, commit ${GITHUB_SHA::7}" --latest=false
          mkdir -p qa-out
          echo "emulator step finished; run ${{ github.run_number }}" >> qa-out/status.txt
          ls qa-out
          gh release upload qa-shots qa-out/* --repo "$SITE" --clobber
