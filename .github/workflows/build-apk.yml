name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no Gradle wrapper jar yet, so use Gradle 8.9 (what AGP 8.7 needs) directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publishes the APK on the repo's Releases page (marked "Latest"), replacing the previous one.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DocScan-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DocScan-debug.apk \
            --title "DocScan (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download DocScan-debug.apk on your phone and install it (allow installs from unknown sources)." \
            --target "$GITHUB_SHA" \
            --latest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
