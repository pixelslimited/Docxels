name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no Gradle wrapper jar yet, so use Gradle 8.9 (what AGP 8.7 needs) directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # Release build: shrunk (R8), not debuggable (faster image processing), arm64 only.
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Size breakdown
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          {
            echo "APK size: $(du -h "$APK" | cut -f1)"
            echo
            echo "Largest parts (compressed bytes, file):"
            unzip -v "$APK" | awk 'NR>3 && NF>=8 {print $3, $8}' | sort -rn | head -12
          } | tee size.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publishes the APK on the repo's Releases page (marked "Latest"), replacing the previous one.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DocScan.apk
          gh release delete latest --yes --cleanup-tag || true
          {
            echo "Built from commit ${GITHUB_SHA::7}. Download DocScan.apk on your phone and install it (allow installs from unknown sources)."
            echo
            echo '```'
            cat size.txt
            echo '```'
          } > notes.md
          gh release create latest DocScan.apk \
            --title "DocScan (latest build)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
