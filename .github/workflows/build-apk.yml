name: Build APK

on:
  push:
    branches: [main]
    # Notes, plans and store text do not change the app, so they do not need a build.
    paths-ignore: ['**/*.md', 'docs/**', 'store/**', '.github/workflows/build-opencv-slim.yml']
  workflow_dispatch:

# One build at a time: two builds publishing together delete each other's release and fail. A newer waiting build
# replaces an older waiting one.
concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no Gradle wrapper jar yet, so use Gradle 8.9 (what AGP 8.7 needs) directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Writes the "What's new" cards' text into the app itself (so they show offline, right after installing).
      - name: Stamp what's new
        run: |
          mkdir -p app/src/main/assets
          python3 scripts/stamp-notes.py RELEASE_NOTES.txt "$(( GITHUB_RUN_NUMBER + 200 ))" app/src/main/assets/whatsnew.txt \
            "https://github.com/iCode010101/docxels-site/releases/latest/download/update.json"

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build.log

      # Posts a generated sample .docx (base64) on the commit so the writer can be checked in real Word-compatible software.
      - name: Code quality review (dead code, duplicates, unused resources)
        run: |
          python3 scripts/code-review.py | tee review.txt
          { echo '### Code quality review'; echo '```'; cat review.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Post sample document
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=app/build/word-sample/sample.docx
          if [ -f "$F" ]; then
            { echo "docx-sample base64:"; echo '```'; base64 -w0 "$F"; echo; echo '```'; } > sample.md
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@sample.md || true
          fi

      # Release build: shrunk (R8), not debuggable (faster image processing), arm64 only.
      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee -a build.log

      # Google Play wants an app bundle (.aab). It is signed with the private upload key from the repository secrets when they
      # exist (DOCXELS_UPLOAD_KEYSTORE_B64 and the three DOCXELS_UPLOAD_* passwords); otherwise it is signed with the sideload key
      # and is only good for checking that the bundle builds. It runs only when the commit message contains [bundle] (or the workflow is started by hand). A failure here never stops the APK from being published.
      - name: Build app bundle for Google Play
        if: contains(github.event.head_commit.message, '[bundle]') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          UPLOAD_B64: ${{ secrets.DOCXELS_UPLOAD_KEYSTORE_B64 }}
          DOCXELS_UPLOAD_STORE_PASSWORD: ${{ secrets.DOCXELS_UPLOAD_STORE_PASSWORD }}
          DOCXELS_UPLOAD_KEY_ALIAS: ${{ secrets.DOCXELS_UPLOAD_KEY_ALIAS }}
          DOCXELS_UPLOAD_KEY_PASSWORD: ${{ secrets.DOCXELS_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_B64" ]; then
            echo "$UPLOAD_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export DOCXELS_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          gradle :app:bundleRelease -PplaySigning=true --stacktrace 2>&1 | tail -5
          ls -la app/build/outputs/bundle/release/ || true

      - name: Upload app bundle
        if: contains(github.event.head_commit.message, '[bundle]') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed. Compiler / test errors:"
            echo '```'
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed" -A2 build.log | head -80
            echo '```'
            echo "Failing tests (message and first stack lines):"
            echo '```'
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for fail in case.findall("failure"):
                      print(case.get("classname"), case.get("name"))
                      print("\n".join((fail.get("message") or "")[:400].splitlines()[:3]))
                      print("\n".join((fail.text or "").splitlines()[:14]))
          PY
            echo '```'
          } > err.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@err.md || true

      - name: Size breakdown
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          {
            echo "APK size: $(du -h "$APK" | cut -f1)"
            echo
            echo "Permissions requested by the APK:"
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" || echo "(could not read)"
            echo
            echo "Largest parts (compressed bytes, file):"
            unzip -v "$APK" | awk 'NR>3 && NF>=8 {print $3, $8}' | sort -rn | head -12
          } | tee size.txt

      # Networking is allowed only for the update check (update/) and the signed-in assistant, payments and sync (cloud/). Fail if network code appears anywhere else.
      - name: Check networking is confined to the updater
        run: |
          if grep -rEl "HttpURLConnection|java\.net\.URL|okhttp3|openConnection" app/src/main/java | grep -v -e "/update/" -e "/cloud/"; then
            echo "::error::Network code found outside com.docscan.app.update or .cloud."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publishes the APK on the repo's Releases page (marked "Latest"), replacing the previous one.
      # The in-app updater reads the site repo, not this release, so a failure here must not stop the site publish below.
      - name: Publish GitHub Release
        id: release
        continue-on-error: true
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee release.log) 2>&1
          cp app/build/outputs/apk/release/app-release.apk Docxels.apk
          {
            echo "Built from commit ${GITHUB_SHA::7}. Download Docxels.apk on your phone and install it (allow installs from unknown sources)."
            echo
            echo '```'
            cat size.txt
            echo '```'
          } > notes.md
          # Deleting and re-creating can briefly clash on GitHub's side, so try a few times.
          for attempt in 1 2 3 4 5; do
            gh release delete latest --yes --cleanup-tag || true
            sleep $((attempt * 5))
            if gh release create latest Docxels.apk \
              --title "Docxels (latest build)" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              --latest; then
              exit 0
            fi
            echo "release attempt $attempt failed"
          done
          exit 1

      - name: Report release errors on the commit
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Publishing the GitHub release failed (the site update still ran). Last lines:"; echo '```'; tail -n 25 release.log; echo '```'; } > rel.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat rel.md)" || true

      # Publishes the APK + update.json on the public site repo so the app's "Check for updates" can find it.
      # Needs a repository secret SITE_TOKEN (a token with write access to iCode010101/docxels-site). Skipped if absent.
      - name: Publish update for the in-app updater
        if: github.event_name != 'pull_request' && env.SITE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash scripts/publish-update.sh Docxels.apk "$RUN_NUMBER" 2>&1 | tee publish.log

      - name: Report publish errors on the commit
        if: failure() && hashFiles('publish.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Publishing to the site failed. Last lines of the log:"
            echo '```'
            tail -n 25 publish.log
            echo '```'
          } > pub.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat pub.md)" || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
