name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no Gradle wrapper jar yet, so use Gradle 8.9 (what AGP 8.7 needs) directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build.log

      # Posts a generated sample .docx (base64) on the commit so the writer can be checked in real Word-compatible software.
      - name: Post sample document
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=app/build/word-sample/sample.docx
          if [ -f "$F" ]; then
            { echo "docx-sample base64:"; echo '```'; base64 -w0 "$F"; echo; echo '```'; } > sample.md
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@sample.md || true
          fi

      # Release build: shrunk (R8), not debuggable (faster image processing), arm64 only.
      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed. Compiler / test errors:"
            echo '```'
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed" -A2 build.log | head -80
            echo '```'
          } > err.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@err.md || true

      - name: Size breakdown
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          {
            echo "APK size: $(du -h "$APK" | cut -f1)"
            echo
            echo "Permissions requested by the APK:"
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" || echo "(could not read)"
            echo
            echo "Largest parts (compressed bytes, file):"
            unzip -v "$APK" | awk 'NR>3 && NF>=8 {print $3, $8}' | sort -rn | head -12
          } | tee size.txt

      # Docxels promises "no internet access". Fail the build if a library sneaks the permission back in.
      - name: Check the APK has no network permission
        run: |
          if "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions app/build/outputs/apk/release/app-release.apk | grep -q "INTERNET"; then
            echo "::error::The APK requests INTERNET, but the app promises to work offline only."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publishes the APK on the repo's Releases page (marked "Latest"), replacing the previous one.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Docxels.apk
          gh release delete latest --yes --cleanup-tag || true
          {
            echo "Built from commit ${GITHUB_SHA::7}. Download Docxels.apk on your phone and install it (allow installs from unknown sources)."
            echo
            echo '```'
            cat size.txt
            echo '```'
          } > notes.md
          gh release create latest Docxels.apk \
            --title "Docxels (latest build)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
